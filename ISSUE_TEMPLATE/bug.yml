name: Bug
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the bug clearly and concisely.
      placeholder: What happened? What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps To Reproduce
      description: List the exact steps so others can reproduce the issue.
      placeholder: |
        1. Go to ...
        2. Click ...
        Or provide a screenshot or gif showing the issue.
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: Checklist of conditions that must be met to close this issue.
      placeholder: |
        - [ ] Bug cause is identified
        - [ ] Fix is implemented
        - [ ] Fix is verified
    validations:
      required: true

